<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Yalendar{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=glass1">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="yale-mark">Yale</span>
      <a href="/">Yalendar</a>
      <p>Campus events for Yale students</p>
    </div>
    <nav>
      <a href="/">Day</a>
      <a href="/week">Week</a>
      <a href="/calendar">Month</a>
      <a href="/ask">Ask</a>
      <a href="/sources">Sources</a>
      <a href="/settings">Feeds</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function yalendarHourLabel(hour) {
      hour = Number(hour);
      var suffix = hour < 12 ? "AM" : "PM";
      var hour12 = hour % 12 || 12;
      return hour12 + ":00 " + suffix;
    }
    function yalendarTimePreview(el) {
      var label = "From " + yalendarHourLabel(el.value);
      var out = document.getElementById("time-readout");
      if (out) out.textContent = label;
      el.setAttribute("aria-valuetext", label);
      var wrap = el.parentElement;
      wrap.classList.remove("dim");
      var bubble = document.getElementById("time-bubble");
      if (bubble) {
        bubble.hidden = false;
        bubble.textContent = yalendarHourLabel(el.value);
        var min = Number(el.min);
        var max = Number(el.max);
        var pct = max === min ? 0 : (Number(el.value) - min) / (max - min);
        bubble.style.left = (pct * 100) + "%";
      }
    }
    function yalendarTimeGo(el) {
      var hour = String(Number(el.value)).padStart(2, "0");
      location.href = el.parentElement.dataset.template.replace("CLOCK", hour + ":00");
    }
  </script>
  <script src="/static/fluid.js?v=1"></script>
  <script src="/static/chat.js?v=5" defer></script>
  <script>
    // Press feedback is delegated once, on pointerdown.
    window.addEventListener("DOMContentLoaded", function () {
      if (window.Fluid) {
        window.Fluid.pressable(document.body,
          ".chip, .ghost, button, .mini-day, .tb-arrow, .tb-today, .tb-pick");
      }

      // A <details> popover has no dismissal behaviour of its own: without
      // this it stays open until you click its own summary again.
      function closePops(except) {
        document.querySelectorAll("details.pop[open]").forEach(function (d) {
          if (d !== except) d.open = false;
        });
      }
      document.addEventListener("pointerdown", function (e) {
        var inside = e.target.closest ? e.target.closest("details.pop") : null;
        closePops(inside);
      }, true);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closePops(null);
      });
    });
  </script>
</body>
</html>
