app = "yalendar"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  YALE_TODAY_DATA = "/app/data"
  YALE_TODAY_HTTPS = "1"
  # The shared build serves the committed public-only snapshot: no live
  # fetching, no writes, no Yale session. See yale_today/config.py.
  YALENDAR_MODE = "demo"
  # Visitors may use the AI assistant, but the total bill for doing so is
  # bounded at one dollar for the life of the deployment -- not per day,
  # which would be a recurring charge. At gpt-6-luna rates that is roughly
  # 2,300 questions; the per-day question cap binds long before the money
  # does. See yale_today/agent/budget.py.
  YALENDAR_PUBLIC_AGENT = "1"
  YALENDAR_MAX_COST_TOTAL = "1.00"
  YALENDAR_MAX_QUESTIONS_PER_DAY = "60"
  YALENDAR_MAX_COST_PER_DAY = "0.10"
  YALENDAR_MAX_QUESTIONS_PER_HOUR = "5"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
